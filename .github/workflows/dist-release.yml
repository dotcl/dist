name: Dist release

on:
  schedule:
    # once a day, 21:17 UTC = 06:17 JST (not on the hour: GitHub delays scheduled runs that start on the hour)
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'generate and check only; no commit, no push, no release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dist-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to release, and whether it is live
        id: decide
        run: |
          set -eu
          # Live or dry. A run by hand follows its dry_run input. A scheduled run is LIVE only while the file
          # .auto-release-live exists on master: enabling this workflow alone never releases anything.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then dry="$INPUT_DRY_RUN"
          elif [ -f .auto-release-live ]; then dry=false
          else dry=true; fi
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          if [ -f .no-auto-release ]; then echo "skip=kill switch (.no-auto-release)" >> "$GITHUB_OUTPUT"; exit 0; fi
          last_tag=$(git tag --list 'dist-*' --sort=-creatordate | head -1)
          last_commit=$(git rev-list -n1 "$last_tag")
          head_commit=$(git rev-parse HEAD)
          version=$(TZ=Asia/Tokyo date +%F)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
          if [ "$head_commit" = "$last_commit" ]; then echo "skip=master is the last release commit ($last_tag)" >> "$GITHUB_OUTPUT"; exit 0; fi
          # a dist version is published once, and never with a -2 name: any tag or release for today's date ends the run
          if git tag --list "dist-$version*" | grep -q .; then echo "skip=a tag for $version exists" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' | grep -q "^dist-$version"; then
            echo "skip=a release for $version exists" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "skip=" >> "$GITHUB_OUTPUT"

      - name: Skipped
        if: steps.decide.outputs.skip != ''
        run: |
          echo "no release - ${{ steps.decide.outputs.skip }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install SBCL and dotcl
        if: steps.decide.outputs.skip == ''
        run: |
          set -eu
          sudo apt-get update && sudo apt-get install -y sbcl
          dotnet --version
          dotnet tool install --global dotcl
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Validate (schema, upstream state, source ledger)
        if: steps.decide.outputs.skip == ''
        run: |
          set -eu
          sbcl --script scripts/validate.lisp
          LEDGER_CHECK_NETWORK=1 sbcl --script scripts/validate.lisp
          sbcl --script scripts/test-source-ledger.lisp

      - name: Systems the .asd files need to be read (scripts/read-deps.txt; not shipped, see README)
        if: steps.decide.outputs.skip == ''
        run: |
          set -eu
          scripts/fetch-read-deps.sh "$RUNNER_TEMP/read-deps"
          echo "CL_SOURCE_REGISTRY=$RUNNER_TEMP/read-deps//" >> "$GITHUB_ENV"

      - name: Generate the dist
        if: steps.decide.outputs.skip == ''
        env:
          DIST_VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -eu
          dotcl scripts/gen-dist.lisp 2>&1 | tee gen.log
          # a .asd file gen-dist could not read leaves its systems out of the dist: stop
          if grep -q '^;; WARNING: cannot read ' gen.log; then
            { echo "gen-dist could not read these .asd files (a system is missing from scripts/read-deps.txt):"; grep -A1 '^;; WARNING: cannot read ' gen.log; } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          prev=$(ls docs/dotcl | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | grep -v "^$DIST_VERSION$" | sort | tail -1)
          # the human check of the manual procedure, as a rule: no system may disappear
          gone=$(comm -23 <(sort "docs/dotcl/$prev/systems.txt") <(sort "docs/dotcl/$DIST_VERSION/systems.txt"))
          if [ -n "$gone" ]; then
            { echo "systems that disappeared since $prev (release by hand if this is intended):"; echo "$gone"; } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          grep '^;; UPLOAD: ' gen.log | sed 's/^;; UPLOAD: //' > uploads.txt || true
          echo "tarballs to attach:"
          cat uploads.txt

      - name: Check the new tarballs load on dotcl
        if: steps.decide.outputs.skip == ''
        run: dotcl scripts/check-loadable.lisp

      - name: Dry run ends here
        if: steps.decide.outputs.skip == '' && steps.decide.outputs.dry == 'true'
        run: |
          echo "dry run: generated and checked ${{ steps.decide.outputs.version }}; nothing committed, pushed or released" >> "$GITHUB_STEP_SUMMARY"

      - name: Draft release with the tarballs
        if: steps.decide.outputs.skip == '' && steps.decide.outputs.dry != 'true'
        env:
          V: ${{ steps.decide.outputs.version }}
        run: |
          set -eu
          gh release create "dist-$V" --draft --title "Dist $V" --notes "Dist $V (generated by the Dist release workflow)" $(cat uploads.txt)

      - name: Commit and push docs
        if: steps.decide.outputs.skip == '' && steps.decide.outputs.dry != 'true'
        env:
          V: ${{ steps.decide.outputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Dist $V"
          git push origin HEAD:master

      - name: Publish the release (the tag lands on the pushed commit)
        if: steps.decide.outputs.skip == '' && steps.decide.outputs.dry != 'true'
        env:
          V: ${{ steps.decide.outputs.version }}
        run: |
          set -eu
          gh release edit "dist-$V" --draft=false --target "$(git rev-parse HEAD)"

      - name: Check every published asset
        if: steps.decide.outputs.skip == '' && steps.decide.outputs.dry != 'true'
        run: LEDGER_CHECK_NETWORK=1 sbcl --script scripts/validate.lisp
