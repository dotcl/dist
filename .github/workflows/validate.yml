name: Validate manifest

on:
  # Manual only while this repository is private: private-repo Actions minutes
  # are metered, and this check is cheap to run by hand. Enable the push /
  # pull_request / weekly-schedule triggers below when the repository goes
  # public — sources drift on their own (an upstream PR merges, a fork is
  # renamed), and the weekly run is what turns that into a notification.
  workflow_dispatch:
  # push:
  # pull_request:
  # schedule:
  #   - cron: '0 3 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Schema
        run: sbcl --script scripts/validate.lisp
      - name: Schema + upstream state
        env:
          LEDGER_CHECK_NETWORK: '1'
          GH_TOKEN: ${{ github.token }}
        run: sbcl --script scripts/validate.lisp
      - name: qlfile generates
        run: sbcl --script scripts/gen-qlfile.lisp
