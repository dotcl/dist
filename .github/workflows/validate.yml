name: Validate manifest

on:
  workflow_dispatch:
  push:
  pull_request:
  # Sources drift without anyone touching this repository — an upstream pull
  # request merges, a fork gets renamed — so the weekly run is what turns that
  # into a notification.
  schedule:
    - cron: '0 3 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Schema
        run: sbcl --script scripts/validate.lisp
      - name: Schema + upstream state
        env:
          LEDGER_CHECK_NETWORK: '1'
          GH_TOKEN: ${{ github.token }}
        run: sbcl --script scripts/validate.lisp
      - name: qlfile generates
        run: sbcl --script scripts/gen-qlfile.lisp
